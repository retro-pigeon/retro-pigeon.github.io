<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Math Challenge!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .score-board {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      background: #f0f4f8;
      padding: 8px 16px;
      border-radius: 12px;
    }
    .timer-bar-container {
      width: 100%;
      height: 14px;
      background: #e0e0e0;
      border-radius: 7px;
      margin-bottom: 25px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background: #4caf50;
      transition: width 0.1s linear, background-color 0.3s ease;
    }
    .problem-display {
      font-size: 4rem;
      font-weight: bold;
      color: #2c3e50;
      margin: 20px 0;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }
    .btn-option {
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 20px;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #357abd;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-option:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #357abd;
    }
    .feedback-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 24px;
      z-index: 10;
    }
    .feedback-text {
      font-size: 2rem;
      color: #e74c3c;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .solution-text {
      font-size: 2.5rem;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .btn-next {
      background: #2ecc71;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 #27ae60;
    }
    .btn-next:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #27ae60;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="header">
      <div style="font-size: 1.2rem; font-weight: bold; color: #7f8c8d;">Math Dash</div>
      <div class="score-board">Score: <span id="score">0</span></div>
    </div>

    <div class="timer-bar-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <div id="problem" class="problem-display">? × ?</div>

    <div id="options-container" class="options-grid">
      <button class="btn-option" onclick="selectAnswer(0)"></button>
      <button class="btn-option" onclick="selectAnswer(1)"></button>
      <button class="btn-option" onclick="selectAnswer(2)"></button>
      <button class="btn-option" onclick="selectAnswer(3)"></button>
    </div>

    <div id="feedback-screen" class="feedback-overlay hidden">
      <div class="feedback-text">Oops! (-5)</div>
      <div id="solution-display" class="solution-text">6 × 7 = 42</div>
      <button class="btn-next" onclick="resumeGame()">Got It!</button>
    </div>
  </div>

  <script>
    const TIME_LIMIT = 4500; // 4.5 seconds
    let score = 0;
    let currentFactor1 = 0;
    let currentFactor2 = 0;
    let correctAnswer = 0;
    let timerId = null;
    let startTime = 0;
    let missedProblems = [];

    // --- Web Audio Synthesizer ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, delay = 0) {
      if (!audioCtx) return;
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }, delay);
    }

    function playSoundCorrect() {
      initAudio();
      // Happy two-tone chime (E5 -> A5)
      playTone(659.25, 'sine', 0.15, 0);
      playTone(880.00, 'sine', 0.3, 100);
    }

    function playSoundWrong() {
      initAudio();
      // Low buzz sound
      playTone(150, 'sawtooth', 0.35, 0);
    }

    function playSoundClick() {
      initAudio();
      // Soft pop sound
      playTone(400, 'sine', 0.05, 0);
    }

    // --- Game Logic ---
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateProblem() {
      if (missedProblems.length > 0 && Math.random() < (1 / 3)) {
        const index = getRandomInt(0, missedProblems.length - 1);
        const problem = missedProblems[index];
        currentFactor1 = problem.f1;
        currentFactor2 = problem.f2;
      } else {
        currentFactor1 = getRandomInt(1, 10);
        currentFactor2 = getRandomInt(1, 10);
      }
      correctAnswer = currentFactor1 * currentFactor2;
    }

    function generateOptions(correct) {
      const options = new Set([correct]);
      
      while (options.size < 4) {
        let offset = getRandomInt(-10, 10);
        let distractor = correct + offset;
        
        if (distractor > 0 && distractor !== correct) {
          options.add(distractor);
        }
      }

      return Array.from(options).sort(() => Math.random() - 0.5);
    }

    function renderQuestion() {
      generateProblem();
      document.getElementById('problem').textContent = `${currentFactor1} × ${currentFactor2}`;
      
      const choices = generateOptions(correctAnswer);
      const buttons = document.querySelectorAll('.btn-option');
      
      buttons.forEach((btn, index) => {
        btn.textContent = choices[index];
        btn.dataset.val = choices[index];
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timerId);
      const timerBar = document.getElementById('timer-bar');
      timerBar.style.width = '100%';
      timerBar.style.backgroundColor = '#4caf50';
      
      startTime = Date.now();
      
      timerId = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, TIME_LIMIT - elapsed);
        const percentage = (remaining / TIME_LIMIT) * 100;
        
        timerBar.style.width = percentage + '%';

        if (percentage < 30) {
          timerBar.style.backgroundColor = '#e74c3c';
        } else if (percentage < 60) {
          timerBar.style.backgroundColor = '#f39c12';
        }

        if (remaining <= 0) {
          clearInterval(timerId);
          handleWrongAnswer();
        }
      }, 50);
    }

    function triggerConfetti() {
      confetti({
        particleCount: 60,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function selectAnswer(index) {
      clearInterval(timerId);
      playSoundClick();

      const buttons = document.querySelectorAll('.btn-option');
      const selectedValue = parseInt(buttons[index].dataset.val, 10);

      if (selectedValue === correctAnswer) {
        score += 1;
        document.getElementById('score').textContent = score;
        
        missedProblems = missedProblems.filter(
          p => !(p.f1 === currentFactor1 && p.f2 === currentFactor2) &&
               !(p.f1 === currentFactor2 && p.f2 === currentFactor1)
        );

        playSoundCorrect();
        triggerConfetti();
        renderQuestion();
      } else {
        handleWrongAnswer();
      }
    }

    function handleWrongAnswer() {
      playSoundWrong();
      score -= 5;
      document.getElementById('score').textContent = score;

      const exists = missedProblems.some(
        p => (p.f1 === currentFactor1 && p.f2 === currentFactor2)
      );
      if (!exists) {
        missedProblems.push({ f1: currentFactor1, f2: currentFactor2 });
      }

      document.getElementById('solution-display').textContent = `${currentFactor1} × ${currentFactor2} = ${correctAnswer}`;
      document.getElementById('feedback-screen').classList.remove('hidden');
    }

    function resumeGame() {
      playSoundClick();
      document.getElementById('feedback-screen').classList.add('hidden');
      renderQuestion();
    }

    // Start the game on initial load
    renderQuestion();
  </script>
</body>
</html>
