<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Divisibility Practice</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #111d31;
      --panel-2: #17263e;
      --text: #f4f7fb;
      --muted: #aebbd0;
      --accent: #67e8f9;
      --accent-2: #a78bfa;
      --good: #5ee28a;
      --bad: #ff7a8a;
      --warn: #ffd166;
      --line: rgba(255,255,255,.14);
      --shadow: 0 18px 50px rgba(0,0,0,.38);
      --radius: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(103,232,249,.18), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(167,139,250,.17), transparent 38rem),
        var(--bg);
      color: var(--text);
      min-height: 100%;
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button {
      border: 0;
      color: var(--text);
      background: var(--panel-2);
      min-height: 52px;
      min-width: 52px;
      border-radius: 18px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    button:focus-visible, input:focus-visible { outline: 4px solid rgba(103,232,249,.55); outline-offset: 3px; }
    button:active { transform: translateY(1px) scale(.99); }
    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 18px clamp(14px, 3vw, 28px) 28px;
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }
    .title h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.2rem); line-height: .94; letter-spacing: -.05em; }
    .title p { margin: 10px 0 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.18rem); }
    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: end; }
    .pill-button { padding: 0 18px; font-weight: 800; }
    .danger { background: rgba(255,122,138,.16); }
    .sound-off { background: rgba(255,209,102,.16); }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: rgba(17,29,49,.82);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .stat .label { display: block; color: var(--muted); font-size: .9rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
    .stat .value { display: block; font-size: clamp(1.35rem, 3vw, 2.2rem); font-weight: 950; margin-top: 4px; }
    .main-grid { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
    .card {
      background: rgba(17,29,49,.9);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .mode-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px;
      background: rgba(255,255,255,.035);
      border-bottom: 1px solid var(--line);
    }
    .mode { font-size: clamp(1rem, 2vw, 1.22rem); font-weight: 950; padding: 0 12px; }
    .mode[aria-pressed="true"] {
      background: linear-gradient(135deg, rgba(103,232,249,.25), rgba(167,139,250,.28));
      box-shadow: inset 0 0 0 2px rgba(103,232,249,.7), 0 0 0 4px rgba(103,232,249,.06);
    }
    .problem-area { padding: clamp(18px, 4vw, 34px); }
    .timer-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; margin-bottom: 26px; }
    .time-track { height: 22px; border-radius: 999px; background: rgba(255,255,255,.09); overflow: hidden; border: 1px solid var(--line); }
    .time-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--good), var(--accent), var(--accent-2)); border-radius: inherit; transition: width .08s linear; }
    .time-fill.low { background: linear-gradient(90deg, var(--bad), var(--warn)); }
    .countdown { font-weight: 950; font-size: clamp(1.2rem, 3vw, 2rem); min-width: 5ch; text-align: right; }
    .problem-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; color: var(--muted); font-weight: 800; }
    .tag { padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.075); border: 1px solid var(--line); }
    .statement {
      margin: 0 0 18px;
      font-size: clamp(3.3rem, 13vw, 8.5rem);
      line-height: .96;
      letter-spacing: -.06em;
      font-weight: 1000;
      text-align: center;
    }
    .hint { color: var(--muted); text-align: center; font-size: clamp(1rem, 2vw, 1.18rem); min-height: 1.5em; margin-bottom: 16px; }
    .answer-form { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
    .answer-input {
      width: 100%;
      min-height: 68px;
      border: 1px solid var(--line);
      background: rgba(2,7,18,.55);
      color: var(--text);
      border-radius: 20px;
      padding: 0 22px;
      font-size: clamp(1.8rem, 6vw, 3.4rem);
      font-weight: 950;
      text-align: center;
      caret-color: var(--accent);
    }
    .submit { min-height: 68px; padding: 0 24px; font-size: 1.25rem; font-weight: 950; background: linear-gradient(135deg, rgba(103,232,249,.28), rgba(167,139,250,.30)); }
    .feedback {
      margin-top: 16px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 18px;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 950;
      border: 1px solid transparent;
    }
    .feedback.good { background: rgba(94,226,138,.14); border-color: rgba(94,226,138,.45); }
    .feedback.bad { background: rgba(255,122,138,.14); border-color: rgba(255,122,138,.45); }
    .feedback.warn { background: rgba(255,209,102,.13); border-color: rgba(255,209,102,.42); }
    .numpad {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .numpad button { min-height: clamp(56px, 10vw, 76px); font-size: clamp(1.25rem, 4vw, 2rem); font-weight: 950; }
    .numpad .wide { grid-column: span 3; }
    .confetti-layer { pointer-events: none; position: fixed; inset: 0; overflow: hidden; z-index: 30; }
    .confetti {
      position: absolute;
      width: 10px;
      height: 16px;
      border-radius: 4px;
      opacity: .95;
      animation: fall 850ms ease-out forwards;
    }
    @keyframes fall {
      from { transform: translate3d(0, -20px, 0) rotate(0deg); opacity: 1; }
      to { transform: translate3d(var(--dx), 160px, 0) rotate(260deg); opacity: 0; }
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 820px) {
      header { grid-template-columns: 1fr; }
      .top-actions { justify-content: stretch; }
      .top-actions button { flex: 1; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .main-grid { grid-template-columns: 1fr; }
      .mode-bar { grid-template-columns: 1fr; }
      .answer-form { grid-template-columns: 1fr; }
      .submit { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <div class="app">
    <header>
      <div class="title">
        <h1>Divisibility Practice</h1>
        <p>Practice C-style integer division <strong>/</strong> and remainder <strong>%</strong>. Type the answer and press Enter.</p>
      </div>
      <div class="top-actions">
        <button id="soundBtn" class="pill-button" type="button" aria-pressed="false" aria-label="Toggle sound effects">🔊 Sound</button>
      </div>
    </header>

    <section class="stats" aria-label="Practice statistics">
      <div class="stat"><span class="label">Correct today</span><span class="value" id="dailyCorrect">0</span></div>
      <div class="stat"><span class="label">Average last 50</span><span class="value" id="avgMetric">—</span></div>
      <div class="stat"><span class="label">Rating</span><span class="value" id="ratingDisplay">100</span></div>
      <div class="stat"><span class="label">Momentum</span><span class="value" id="momentumDisplay">0</span></div>
    </section>

    <main class="main-grid">
      <section class="card" aria-label="Problem">
        <div class="mode-bar" role="group" aria-label="Practice mode">
          <button class="mode" type="button" data-mode="division" aria-pressed="true">Division /</button>
          <button class="mode" type="button" data-mode="remainder" aria-pressed="false">Remainder %</button>
          <button class="mode" type="button" data-mode="mixed" aria-pressed="false">Mixed</button>
        </div>
        <div class="problem-area">
          <div class="timer-row" aria-label="Timer">
            <div class="time-track" aria-hidden="true"><div class="time-fill" id="timeFill"></div></div>
            <div class="countdown" id="countdown" aria-live="polite">0.0s</div>
          </div>
          <div class="problem-meta">
            <span class="tag" id="modeTag">Division</span>
            <span class="tag" id="problemRatingTag">Problem rating 100</span>
            <span class="tag" id="timeTag">Time 20.0s</span>
          </div>
          <h2 class="statement" id="statement">8 / 2 = ?</h2>
          <div class="hint" id="hint">For positive numbers, C integer division drops the decimal part.</div>
          <form class="answer-form" id="answerForm" autocomplete="off">
            <label class="sr-only" for="answerInput">Your answer</label>
            <input id="answerInput" class="answer-input" type="text" inputmode="none" readonly aria-readonly="true" aria-describedby="hint feedback" placeholder="?" />
            <button class="submit" type="submit">Check</button>
          </form>
          <div class="feedback" id="feedback" role="status" aria-live="polite">Ready.</div>
          <div class="numpad" aria-label="Number pad">
            <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
            <button type="button" data-key="clear">Clear</button><button type="button" data-key="0">0</button><button type="button" data-key="back">⌫</button>
            <button class="wide" type="button" data-key="enter">Enter</button>
          </div>
        </div>
      </section>
    </main>
  </div>


  <script>
  (() => {
    'use strict';
    const APP_ID = 260901;
    const DB_NAME = 'problem_logs';
    const STORE_NAME = 'logs';
    const LS_PREFIX = 'cesc_260901_';
    const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '_' + Math.random().toString(16).slice(2);

    const els = {
      soundBtn: document.getElementById('soundBtn'),
      dailyCorrect: document.getElementById('dailyCorrect'), avgMetric: document.getElementById('avgMetric'), ratingDisplay: document.getElementById('ratingDisplay'), momentumDisplay: document.getElementById('momentumDisplay'),
      timeFill: document.getElementById('timeFill'), countdown: document.getElementById('countdown'), modeTag: document.getElementById('modeTag'), problemRatingTag: document.getElementById('problemRatingTag'), timeTag: document.getElementById('timeTag'),
      statement: document.getElementById('statement'), hint: document.getElementById('hint'), answerForm: document.getElementById('answerForm'), answerInput: document.getElementById('answerInput'), feedback: document.getElementById('feedback'),
      confettiLayer: document.getElementById('confettiLayer')
    };

    let dbPromise = openDB();
    let mode = localStorage.getItem(LS_PREFIX + 'mode') || 'division';
    let userRating = Number(localStorage.getItem(LS_PREFIX + 'rating')) || 100;
    let momentum = Number(localStorage.getItem(LS_PREFIX + 'momentum')) || 0;
    let streak = Number(localStorage.getItem(LS_PREFIX + 'streak')) || 0;
    let muted = localStorage.getItem(LS_PREFIX + 'muted') === '1';
    let reviewQueue = loadReviewQueue();
    let audioCtx = null;

    let current = null;
    let raf = 0;
    let accepting = true;
    let lowTimePlayed = false;

    function todayKey() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }
    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
    function round2(n) { return Math.round(n * 100) / 100; }
    function intRand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            store.createIndex('emitter', 'emitter', { unique: false });
            store.createIndex('session_id', 'session_id', { unique: false });
            store.createIndex('timestamp', 'timestamp', { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function addLog(entry) {
      try {
        const db = await dbPromise;
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).add({ timestamp: Date.now(), ...entry });
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      } catch (err) {
        console.error('Could not write problem log', err);
      }
      refreshAverageMetric();
    }

    async function refreshAverageMetric() {
      try {
        const db = await dbPromise;
        const rows = await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.openCursor(null, 'prev');
          const out = [];
          req.onsuccess = () => {
            const cursor = req.result;
            if (cursor && out.length < 50) {
              if (cursor.value.emitter === APP_ID && typeof cursor.value.metric === 'number') out.push(cursor.value);
              cursor.continue();
            } else resolve(out);
          };
          req.onerror = () => reject(req.error);
        });
        if (!rows.length) els.avgMetric.textContent = '—';
        else {
          const avg = rows.reduce((s, r) => s + clamp(r.metric, 0, 1), 0) / rows.length;
          els.avgMetric.textContent = Math.round(avg * 100) + '%';
        }
      } catch {
        els.avgMetric.textContent = '—';
      }
    }

    function targetProblemRating() {
      const mag = Math.min(50, Math.pow(Math.abs(momentum), 1.5));
      const signedPct = momentum >= 0 ? mag : -mag;
      return Math.max(25, Math.round(userRating * (1 + signedPct / 100)));
    }

    function timeForRating(rating) {
      // Fourth-grader friendly curve, multiplied by 5: ~116s at rating 50, ~91s at 100, ~43s at 500, approaching 25s for very high ratings.
      const ms = (5000 + 21000 * Math.exp(-rating / 250)) * 5;
      return Math.round(clamp(ms, 25000, 125000));
    }

    function loadReviewQueue() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LS_PREFIX + 'review_queue') || '[]');
        return Array.isArray(parsed) ? parsed.filter(item => item && Number.isInteger(item.dueAfter) && item.problem) : [];
      } catch {
        return [];
      }
    }

    function saveReviewQueue() {
      localStorage.setItem(LS_PREFIX + 'review_queue', JSON.stringify(reviewQueue.slice(0, 20)));
    }

    function buildProblemFromSeed(seed, servedRating, isReview) {
      const op = seed.op;
      const symbol = op === 'division' ? '/' : '%';
      const dividend = seed.dividend;
      const divisor = seed.divisor;
      const answer = op === 'division' ? Math.floor(dividend / divisor) : dividend % divisor;
      const statement = `${dividend} ${symbol} ${divisor} = ?`;
      const totalTime = timeForRating(servedRating);
      return {
        op, symbol, dividend, divisor, answer, statement,
        problemRating: servedRating, generatedDifficulty: candidateDifficulty(dividend, divisor, op), totalTime,
        startedAt: performance.now(), pausedMs: 0, firstInputAt: null, lastInputAt: null,
        previousStreak: streak, isReview
      };
    }

    function takeDueReview(servedRating) {
      if (!reviewQueue.length) return null;
      for (const item of reviewQueue) item.dueAfter -= 1;
      const idx = reviewQueue.findIndex(item => item.dueAfter <= 0);
      if (idx === -1) {
        saveReviewQueue();
        return null;
      }
      const [item] = reviewQueue.splice(idx, 1);
      saveReviewQueue();
      return buildProblemFromSeed(item.problem, servedRating, true);
    }

    function scheduleReview(problem) {
      reviewQueue.push({
        dueAfter: intRand(3, 5),
        problem: { op: problem.op, dividend: problem.dividend, divisor: problem.divisor }
      });
      saveReviewQueue();
    }

    function candidateDifficulty(dividend, divisor, op) {
      const d = (dividend - 1) / 49;
      const v = (divisor - 1) / 9;
      const q = Math.floor(dividend / divisor);
      const rem = dividend % divisor;
      let score = 55 + 150 * d + 95 * v + 35 * Math.min(q / 20, 1);
      if (op === 'division') score += rem === 0 ? 0 : 70;
      if (op === 'remainder') score += rem === 0 ? 8 : 45 + Math.min(rem / 9, 1) * 30;
      if (divisor === 1) score -= 35;
      if (divisor === 10) score -= 15;
      return Math.round(clamp(score, 50, 500));
    }

    function makeProblem() {
      const servedRating = targetProblemRating();
      const reviewProblem = takeDueReview(servedRating);
      if (reviewProblem) return reviewProblem;

      const op = mode === 'mixed' ? (Math.random() < 0.5 ? 'division' : 'remainder') : mode;
      const target = clamp(servedRating, 50, 500);
      let best = null;
      for (let i = 0; i < 90; i++) {
        const dividend = intRand(1, 50);
        const divisor = intRand(1, 10);
        const diff = candidateDifficulty(dividend, divisor, op);
        const noise = Math.random() * 18;
        const distance = Math.abs(diff - target) + noise;
        if (!best || distance < best.distance) best = { dividend, divisor, diff, distance };
      }
      return buildProblemFromSeed({ op, dividend: best.dividend, divisor: best.divisor }, servedRating, false);
    }

    function setMode(nextMode) {
      mode = nextMode;
      localStorage.setItem(LS_PREFIX + 'mode', mode);
      document.querySelectorAll('.mode').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode)));
      sound('input');
      if (current && accepting) startProblem();
    }

    function startProblem() {
      if (raf) cancelAnimationFrame(raf);
      current = makeProblem();
      accepting = true;
      lowTimePlayed = false;
      els.answerInput.value = '';
      els.answerInput.disabled = false;
      els.statement.textContent = current.statement;
      els.modeTag.textContent = (current.isReview ? 'Review · ' : '') + (current.op === 'division' ? 'Division' : 'Remainder');
      els.problemRatingTag.textContent = 'Problem rating ' + current.problemRating;
      els.timeTag.textContent = 'Time ' + (current.totalTime / 1000).toFixed(1) + 's';
      els.hint.textContent = current.op === 'division' ? 'Integer division keeps the whole-number part and drops the remainder.' : 'Remainder asks what is left after making equal groups.';
      setFeedback('New problem. Type your answer.', '');
      updateStats();
      tick();
    }

    function elapsedMs() {
      if (!current) return 0;
      return Math.max(0, performance.now() - current.startedAt - current.pausedMs);
    }

    function tick() {
      if (!current || !accepting) return;
      const elapsed = elapsedMs();
      const left = Math.max(0, current.totalTime - elapsed);
      const x = clamp(left / current.totalTime, 0, 1);
      const visualX = Math.pow(x, 1.7);
      els.timeFill.style.width = (visualX * 100).toFixed(2) + '%';
      els.timeFill.classList.toggle('low', x <= 0.22);
      els.countdown.textContent = (left / 1000).toFixed(1) + 's';
      if (x <= 0.22 && !lowTimePlayed) {
        lowTimePlayed = true;
        setFeedback('Low time — answer soon.', 'warn');
        sound('low');
      }
      if (left <= 0) {
        finish(false, 2, null);
        return;
      }
      raf = requestAnimationFrame(tick);
    }

    function setFeedback(text, kind) {
      els.feedback.textContent = text;
      els.feedback.className = 'feedback' + (kind ? ' ' + kind : '');
    }

    function recordInputMoment() {
      if (!current || !accepting) return;
      const now = performance.now();
      if (current.firstInputAt === null) current.firstInputAt = now;
      current.lastInputAt = now;
    }

    function appendDigit(digit) {
      if (!current || !accepting) return;
      recordInputMoment();
      els.answerInput.value = (els.answerInput.value + digit).slice(0, 4);
      sound('input');
    }

    function backspaceAnswer() {
      if (!current || !accepting) return;
      recordInputMoment();
      els.answerInput.value = els.answerInput.value.slice(0, -1);
      sound('input');
    }

    function clearAnswer() {
      if (!current || !accepting) return;
      recordInputMoment();
      els.answerInput.value = '';
      sound('input');
    }

    function submitAnswer() {
      if (!current || !accepting) return;
      const raw = els.answerInput.value.trim();
      if (!raw) {
        setFeedback('Type a number first.', 'warn');
        sound('wrong');
        return;
      }
      const answer = Number(raw);
      if (!Number.isInteger(answer) || answer < 0) {
        setFeedback('Use whole numbers only.', 'warn');
        sound('wrong');
        return;
      }
      finish(answer === current.answer, 0, answer);
    }

    async function finish(success, verdict, userAnswer) {
      if (!current || !accepting) return;
      accepting = false;
      if (raf) cancelAnimationFrame(raf);
      els.answerInput.disabled = true;
      const used = Math.min(current.totalTime, elapsedMs());
      const leftRatio = verdict === 2 ? 0 : clamp((current.totalTime - used) / current.totalTime, 0, 1);
      const beforeRating = userRating;
      const pr = current.problemRating;
      let delta;
      if (success) delta = (1 + 0.5 * leftRatio) * pr / beforeRating;
      else delta = -(1 + 0.5 * leftRatio) * beforeRating / pr;
      userRating = Math.max(50, beforeRating + delta);
      const beforeMomentum = momentum;
      if (success) momentum = momentum + 1;
      else momentum = momentum > 0 ? Math.floor(momentum / 2) : momentum - 1;
      const previousStreak = current.previousStreak;
      streak = success ? streak + 1 : 0;
      persistState();
      if (success) incrementDailyCorrect();

      const typingTime = current.firstInputAt === null || current.lastInputAt === null ? -1 : Math.max(0, Math.round(current.lastInputAt - current.firstInputAt));
      const logEntry = {
        emitter: APP_ID,
        metric: success ? 1.00 : 0.00,
        rating: round2(beforeRating),
        rating_delta: round2(delta),
        time_allocated: current.totalTime,
        time_used: Math.round(used),
        verdict,
        problem_data: {
          application_id: APP_ID,
          statement: current.statement,
          operation: current.op,
          symbol: current.symbol,
          dividend: current.dividend,
          divisor: current.divisor,
          expected_answer: current.answer,
          user_answer: userAnswer,
          mode,
          problem_rating: current.problemRating,
          generated_difficulty: current.generatedDifficulty,
          is_review: Boolean(current.isReview),
          user_rating_before: round2(beforeRating),
          momentum_before: beforeMomentum
        },
        typing_time: typingTime,
        stall_time: Math.round(current.pausedMs),
        streak: previousStreak,
        tags: [current.op, mode, current.isReview ? 'review' : 'new', 'c_style_operator', 'integer_arithmetic', 'timed'],
        session_id: sessionId
      };
      addLog(logEntry);
      clearPendingQuit();
      if (!success) scheduleReview(current);

      updateStats();
      if (success) {
        setFeedback(`Correct. Answer: ${current.answer}`, 'good');
        els.statement.textContent = current.statement.replace('?', current.answer);
        sound('correct');
        confetti();
        setTimeout(startProblem, 1200);
      } else if (verdict === 2) {
        setFeedback(`Time is up. Correct answer: ${current.answer}`, 'bad');
        els.statement.textContent = current.statement.replace('?', current.answer);
        sound('wrong');
        setTimeout(startProblem, 1600);
      } else {
        setFeedback(`Not quite. Correct answer: ${current.answer}`, 'bad');
        els.statement.textContent = current.statement.replace('?', current.answer);
        sound('wrong');
        setTimeout(startProblem, 1600);
      }
    }

    function persistState() {
      localStorage.setItem(LS_PREFIX + 'rating', String(userRating));
      localStorage.setItem(LS_PREFIX + 'momentum', String(momentum));
      localStorage.setItem(LS_PREFIX + 'streak', String(streak));
    }

    function dailyKey() { return LS_PREFIX + 'daily_' + todayKey(); }
    function incrementDailyCorrect() {
      localStorage.setItem(dailyKey(), String((Number(localStorage.getItem(dailyKey())) || 0) + 1));
    }
    function updateStats() {
      els.dailyCorrect.textContent = String(Number(localStorage.getItem(dailyKey())) || 0);
      els.ratingDisplay.textContent = String(Math.round(userRating));
      els.momentumDisplay.textContent = String(momentum);
      els.soundBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound';
      els.soundBtn.classList.toggle('sound-off', muted);
      els.soundBtn.setAttribute('aria-pressed', String(!muted));
    }

    function audio() {
      if (muted) return null;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, type = 'sine', gain = .05, delay = 0) {
      const ctx = audio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + delay + .01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + dur + .02);
    }
    function sound(kind) {
      if (muted) return;
      if (kind === 'input') tone(520, .055, 'triangle', .025);
      if (kind === 'correct') { tone(660, .10, 'sine', .045); tone(880, .14, 'sine', .045, .08); }
      if (kind === 'wrong') { tone(210, .14, 'sawtooth', .035); tone(155, .18, 'sawtooth', .03, .08); }
      if (kind === 'low') { tone(760, .08, 'square', .025); tone(760, .08, 'square', .025, .16); }
    }

    function confetti() {
      const colors = ['#67e8f9', '#a78bfa', '#5ee28a', '#ffd166'];
      const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 22;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = (45 + Math.random() * 10) + 'vw';
        piece.style.top = (22 + Math.random() * 8) + 'vh';
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty('--dx', ((Math.random() - .5) * 280).toFixed(0) + 'px');
        els.confettiLayer.appendChild(piece);
        setTimeout(() => piece.remove(), 900);
      }
    }

    function savePendingQuit() {
      if (!current || !accepting) return;
      const used = Math.round(Math.min(current.totalTime, elapsedMs()));
      const pending = {
        emitter: APP_ID,
        metric: 0.00,
        rating: round2(userRating),
        rating_delta: 0,
        time_allocated: current.totalTime,
        time_used: used,
        verdict: 3,
        problem_data: {
          application_id: APP_ID,
          statement: current.statement,
          operation: current.op,
          symbol: current.symbol,
          dividend: current.dividend,
          divisor: current.divisor,
          expected_answer: current.answer,
          user_answer: els.answerInput.value.trim() || null,
          mode,
          problem_rating: current.problemRating,
          generated_difficulty: current.generatedDifficulty,
          is_review: Boolean(current.isReview),
          quit_reason: 'pagehide_or_unload'
        },
        typing_time: current.firstInputAt === null || current.lastInputAt === null ? -1 : Math.round(current.lastInputAt - current.firstInputAt),
        stall_time: Math.round(current.pausedMs),
        streak: current.previousStreak,
        tags: [current.op, mode, current.isReview ? 'review' : 'new', 'c_style_operator', 'integer_arithmetic', 'timed', 'quit'],
        session_id: sessionId
      };
      localStorage.setItem(LS_PREFIX + 'pending_quit', JSON.stringify(pending));
      // Best-effort direct IndexedDB write; localStorage copy is flushed next launch if the page closes too quickly.
      addLog(pending);
    }
    async function flushPendingQuit() {
      const raw = localStorage.getItem(LS_PREFIX + 'pending_quit');
      if (!raw) return;
      try { await addLog(JSON.parse(raw)); } catch {}
      clearPendingQuit();
    }
    function clearPendingQuit() { localStorage.removeItem(LS_PREFIX + 'pending_quit'); }

    els.answerForm.addEventListener('submit', e => { e.preventDefault(); submitAnswer(); });
    els.answerInput.addEventListener('focus', () => els.answerInput.blur());
    els.answerInput.addEventListener('input', () => { els.answerInput.value = els.answerInput.value.replace(/\D+/g, '').slice(0, 4); });
    document.querySelectorAll('.mode').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    document.querySelectorAll('.numpad button').forEach(btn => btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if (!accepting) return;
      if (key === 'enter') return submitAnswer();
      if (key === 'clear') return clearAnswer();
      if (key === 'back') return backspaceAnswer();
      appendDigit(key);
    }));
    document.addEventListener('keydown', e => {
      if (!current || !accepting) return;
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); appendDigit(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); backspaceAnswer(); }
      else if (e.key === 'Delete') { e.preventDefault(); clearAnswer(); }
      else if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); }
    });
    els.soundBtn.addEventListener('click', () => { muted = !muted; localStorage.setItem(LS_PREFIX + 'muted', muted ? '1' : '0'); updateStats(); if (!muted) sound('input'); });
    window.addEventListener('pagehide', savePendingQuit);
    window.addEventListener('beforeunload', savePendingQuit);

    document.querySelectorAll('.mode').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode)));
    updateStats();
    refreshAverageMetric();
    flushPendingQuit();
    startProblem();
  })();
  </script>
</body>
</html>
